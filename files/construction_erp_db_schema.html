
<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans, sans-serif); color: var(--color-text-primary); background: transparent; padding: 0 0 24px 0; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 16px 0 12px; border-bottom: 1px solid var(--color-border-tertiary); }
  .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--color-border-secondary); color: var(--color-text-secondary); background: transparent; transition: all .15s; }
  .tab:hover { border-color: var(--color-border-primary); color: var(--color-text-primary); }
  .tab.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }

  .module { display: none; padding: 20px 0 0; }
  .module.active { display: block; }

  .module-desc { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 18px; line-height: 1.6; padding: 12px 14px; border-left: 3px solid var(--color-border-secondary); background: var(--color-background-secondary); border-radius: 0 8px 8px 0; }

  .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

  .table-card { border: 1px solid var(--color-border-tertiary); border-radius: 12px; overflow: hidden; }
  .table-header { padding: 10px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--color-border-tertiary); }
  .table-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); font-family: var(--font-mono, monospace); }
  .table-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: auto; white-space: nowrap; }

  .badge-core    { background: #FAEEDA; color: #633806; }
  .badge-ops     { background: #E1F5EE; color: #085041; }
  .badge-admin   { background: #FAECE7; color: #712B13; }
  .badge-ai      { background: #EEEDFE; color: #3C3489; }
  .badge-ref     { background: #E6F1FB; color: #0C447C; }
  .badge-audit   { background: #F1EFE8; color: #444441; }

  @media (prefers-color-scheme: dark) {
    .badge-core  { background: #633806; color: #FAEEDA; }
    .badge-ops   { background: #085041; color: #E1F5EE; }
    .badge-admin { background: #712B13; color: #FAECE7; }
    .badge-ai    { background: #3C3489; color: #EEEDFE; }
    .badge-ref   { background: #0C447C; color: #E6F1FB; }
    .badge-audit { background: #444441; color: #F1EFE8; }
  }

  .field-list { padding: 8px 0; }
  .field-row { display: flex; align-items: center; gap: 6px; padding: 5px 14px; font-size: 12px; border-bottom: 1px solid var(--color-border-tertiary); }
  .field-row:last-child { border-bottom: none; }
  .field-row:hover { background: var(--color-background-secondary); }

  .field-name { font-family: var(--font-mono, monospace); color: var(--color-text-primary); flex: 1; }
  .field-type { color: var(--color-text-tertiary); font-size: 11px; min-width: 70px; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
  .tag-pk  { background: #FAEEDA; color: #633806; }
  .tag-fk  { background: #E6F1FB; color: #0C447C; }
  .tag-idx { background: #E1F5EE; color: #085041; }
  .tag-uq  { background: #EEEDFE; color: #3C3489; }

  @media (prefers-color-scheme: dark) {
    .tag-pk  { background: #633806; color: #FAEEDA; }
    .tag-fk  { background: #0C447C; color: #E6F1FB; }
    .tag-idx { background: #085041; color: #E1F5EE; }
    .tag-uq  { background: #3C3489; color: #EEEDFE; }
  }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 14px 0 0; font-size: 11px; color: var(--color-text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  .stats { display: flex; gap: 24px; padding: 12px 0 0; }
  .stat { font-size: 11px; color: var(--color-text-secondary); }
  .stat strong { font-size: 20px; font-weight: 500; color: var(--color-text-primary); display: block; }
</style>
</head>
<body>

<div class="stats">
  <div class="stat"><strong>7</strong> Modules</div>
  <div class="stat"><strong>22</strong> Tables</div>
  <div class="stat"><strong>3</strong> Actor roles</div>
  <div class="stat"><strong>2</strong> Input channels</div>
</div>

<div class="tabs" id="tabs"></div>
<div id="modules-container"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#BA7517"></div> Core entity</div>
  <div class="legend-item"><div class="legend-dot" style="background:#0F6E56"></div> Operational</div>
  <div class="legend-item"><div class="legend-dot" style="background:#993C1D"></div> Admin only</div>
  <div class="legend-item"><div class="legend-dot" style="background:#534AB7"></div> AI / system</div>
  <div class="legend-item"><div class="legend-dot" style="background:#185FA5"></div> Reference / lookup</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5F5E5A"></div> Audit / log</div>
</div>

<script>
const modules = [
  {
    id: "core",
    label: "Core entities",
    desc: "The foundational tables that every other module connects to. The Site table is the central business entity — all operational data must link back to a site. Users and roles define who can do what across both Telegram and Web interfaces.",
    tables: [
      {
        name: "sites",
        badge: "core",
        badgeLabel: "Core",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "name", type: "VARCHAR(150)" },
          { name: "location", type: "TEXT" },
          { name: "status", type: "ENUM(active,completed,on_hold)" },
          { name: "start_date", type: "DATE" },
          { name: "expected_end_date", type: "DATE" },
          { name: "actual_end_date", type: "DATE" },
          { name: "created_by", type: "UUID", tag: "fk" },
          { name: "created_at", type: "TIMESTAMPTZ" },
          { name: "updated_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "users",
        badge: "core",
        badgeLabel: "Core",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "name", type: "VARCHAR(120)" },
          { name: "phone", type: "VARCHAR(20)", tag: "uq" },
          { name: "telegram_chat_id", type: "BIGINT", tag: "uq" },
          { name: "role", type: "ENUM(admin,manager,supervisor)" },
          { name: "is_active", type: "BOOLEAN" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "site_user_assignments",
        badge: "core",
        badgeLabel: "Core",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "user_id", type: "UUID", tag: "fk" },
          { name: "assigned_at", type: "TIMESTAMPTZ" },
          { name: "revoked_at", type: "TIMESTAMPTZ" },
        ]
      }
    ]
  },
  {
    id: "workers",
    label: "Workforce",
    desc: "Manages the construction labour pool. Workers are registered once and assigned to sites over time. Skill categorisation enables labour cost breakdown by trade, and historical allocation history supports future resource planning.",
    tables: [
      {
        name: "workers",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "name", type: "VARCHAR(120)", tag: "idx" },
          { name: "phone", type: "VARCHAR(20)", tag: "uq" },
          { name: "skill_category_id", type: "UUID", tag: "fk" },
          { name: "daily_wage_rate", type: "NUMERIC(10,2)" },
          { name: "is_active", type: "BOOLEAN" },
          { name: "joined_at", type: "DATE" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "skill_categories",
        badge: "ref",
        badgeLabel: "Reference",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "name", type: "VARCHAR(80)" },
          { name: "description", type: "TEXT" },
        ]
      },
      {
        name: "site_worker_allocations",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "worker_id", type: "UUID", tag: "fk" },
          { name: "allocated_by", type: "UUID", tag: "fk" },
          { name: "start_date", type: "DATE" },
          { name: "end_date", type: "DATE" },
          { name: "is_active", type: "BOOLEAN" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      }
    ]
  },
  {
    id: "attendance",
    label: "Attendance",
    desc: "Captures daily attendance per worker per site. The half-day flag supports the common construction practice of paying partial days. This table directly feeds into payroll computation and labour cost tracking.",
    tables: [
      {
        name: "attendance_records",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "worker_id", type: "UUID", tag: "fk" },
          { name: "date", type: "DATE", tag: "idx" },
          { name: "status", type: "ENUM(present,absent,half_day,holiday)" },
          { name: "check_in_time", type: "TIME" },
          { name: "check_out_time", type: "TIME" },
          { name: "overtime_hours", type: "NUMERIC(4,2)" },
          { name: "recorded_by", type: "UUID", tag: "fk" },
          { name: "source", type: "ENUM(telegram,web)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      }
    ]
  },
  {
    id: "inventory",
    label: "Inventory",
    desc: "Tracks material lifecycle from procurement to consumption. Receipts record supplier deliveries; consumption records track usage per site activity. Current stock is derived from receipts minus consumption, keyed per site and material — the platform never requires a manual stock-take.",
    tables: [
      {
        name: "materials",
        badge: "ref",
        badgeLabel: "Reference",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "name", type: "VARCHAR(120)", tag: "idx" },
          { name: "unit", type: "VARCHAR(30)" },
          { name: "category", type: "VARCHAR(60)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "suppliers",
        badge: "ref",
        badgeLabel: "Reference",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "name", type: "VARCHAR(150)", tag: "idx" },
          { name: "phone", type: "VARCHAR(20)" },
          { name: "address", type: "TEXT" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "material_receipts",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "material_id", type: "UUID", tag: "fk" },
          { name: "supplier_id", type: "UUID", tag: "fk" },
          { name: "quantity", type: "NUMERIC(12,3)" },
          { name: "unit_price", type: "NUMERIC(10,2)" },
          { name: "total_amount", type: "NUMERIC(12,2)" },
          { name: "received_date", type: "DATE", tag: "idx" },
          { name: "received_by", type: "UUID", tag: "fk" },
          { name: "invoice_ref", type: "VARCHAR(80)" },
          { name: "source", type: "ENUM(telegram,web)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "material_consumption",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "material_id", type: "UUID", tag: "fk" },
          { name: "quantity", type: "NUMERIC(12,3)" },
          { name: "consumed_date", type: "DATE", tag: "idx" },
          { name: "activity_description", type: "TEXT" },
          { name: "recorded_by", type: "UUID", tag: "fk" },
          { name: "source", type: "ENUM(telegram,web)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      }
    ]
  },
  {
    id: "expenses",
    label: "Expenses & Budget",
    desc: "Tracks all non-material site costs (petrol, tools, subcontractor payments, misc). Budget allocations define the financial envelope per site, enabling real-time budget utilisation tracking and alerting on overruns.",
    tables: [
      {
        name: "expense_categories",
        badge: "ref",
        badgeLabel: "Reference",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "name", type: "VARCHAR(80)" },
          { name: "description", type: "TEXT" },
        ]
      },
      {
        name: "site_expenses",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "category_id", type: "UUID", tag: "fk" },
          { name: "amount", type: "NUMERIC(12,2)" },
          { name: "description", type: "TEXT" },
          { name: "expense_date", type: "DATE", tag: "idx" },
          { name: "recorded_by", type: "UUID", tag: "fk" },
          { name: "receipt_ref", type: "VARCHAR(80)" },
          { name: "source", type: "ENUM(telegram,web)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "site_budgets",
        badge: "admin",
        badgeLabel: "Admin only",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "budget_type", type: "ENUM(labour,material,overhead,total)" },
          { name: "allocated_amount", type: "NUMERIC(14,2)" },
          { name: "effective_from", type: "DATE" },
          { name: "effective_to", type: "DATE" },
          { name: "created_by", type: "UUID", tag: "fk" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      }
    ]
  },
  {
    id: "progress",
    label: "Progress & Reports",
    desc: "Stores site milestone definitions and daily operational log entries. Progress logs form the historical narrative of what happened on site each day — the raw material for BI reporting and future AI analysis.",
    tables: [
      {
        name: "site_milestones",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "title", type: "VARCHAR(200)" },
          { name: "description", type: "TEXT" },
          { name: "target_date", type: "DATE" },
          { name: "completed_date", type: "DATE" },
          { name: "status", type: "ENUM(pending,in_progress,completed,delayed)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "site_progress_logs",
        badge: "ops",
        badgeLabel: "Operational",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "log_date", type: "DATE", tag: "idx" },
          { name: "summary", type: "TEXT" },
          { name: "weather_condition", type: "VARCHAR(60)" },
          { name: "workers_present", type: "SMALLINT" },
          { name: "recorded_by", type: "UUID", tag: "fk" },
          { name: "source", type: "ENUM(telegram,web)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      }
    ]
  },
  {
    id: "payroll",
    label: "Payroll",
    desc: "Admin-only module. Payroll runs are generated from attendance records and worker wage rates. Each run is immutable once finalised — line items capture the exact computation. Advance payments and deductions adjust the net payout.",
    tables: [
      {
        name: "payroll_runs",
        badge: "admin",
        badgeLabel: "Admin only",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "period_start", type: "DATE" },
          { name: "period_end", type: "DATE" },
          { name: "status", type: "ENUM(draft,finalised,paid)" },
          { name: "total_amount", type: "NUMERIC(14,2)" },
          { name: "generated_by", type: "UUID", tag: "fk" },
          { name: "finalised_at", type: "TIMESTAMPTZ" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "payroll_line_items",
        badge: "admin",
        badgeLabel: "Admin only",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "payroll_run_id", type: "UUID", tag: "fk" },
          { name: "worker_id", type: "UUID", tag: "fk" },
          { name: "days_present", type: "NUMERIC(5,1)" },
          { name: "days_absent", type: "NUMERIC(5,1)" },
          { name: "overtime_hours", type: "NUMERIC(5,2)" },
          { name: "base_amount", type: "NUMERIC(12,2)" },
          { name: "overtime_amount", type: "NUMERIC(12,2)" },
          { name: "deductions", type: "NUMERIC(12,2)" },
          { name: "advances_adjusted", type: "NUMERIC(12,2)" },
          { name: "net_amount", type: "NUMERIC(12,2)" },
        ]
      },
      {
        name: "worker_advances",
        badge: "admin",
        badgeLabel: "Admin only",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "worker_id", type: "UUID", tag: "fk" },
          { name: "site_id", type: "UUID", tag: "fk" },
          { name: "amount", type: "NUMERIC(12,2)" },
          { name: "issued_date", type: "DATE" },
          { name: "adjusted_in_run_id", type: "UUID", tag: "fk" },
          { name: "created_by", type: "UUID", tag: "fk" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      },
      {
        name: "audit_logs",
        badge: "audit",
        badgeLabel: "Audit",
        fields: [
          { name: "id", type: "UUID", tag: "pk" },
          { name: "table_name", type: "VARCHAR(80)" },
          { name: "record_id", type: "UUID" },
          { name: "action", type: "ENUM(insert,update,delete)" },
          { name: "actor_id", type: "UUID", tag: "fk" },
          { name: "old_data", type: "JSONB" },
          { name: "new_data", type: "JSONB" },
          { name: "source", type: "ENUM(telegram,web,system)" },
          { name: "created_at", type: "TIMESTAMPTZ" },
        ]
      }
    ]
  }
];

const tagClass = { pk: "tag-pk", fk: "tag-fk", idx: "tag-idx", uq: "tag-uq" };
const tagLabel = { pk: "PK", fk: "FK", idx: "IDX", uq: "UQ" };

function renderField(f) {
  return `<div class="field-row">
    <span class="field-name">${f.name}</span>
    <span class="field-type">${f.type}</span>
    ${f.tag ? `<span class="tag ${tagClass[f.tag]}">${tagLabel[f.tag]}</span>` : ""}
  </div>`;
}

function renderTable(t) {
  return `<div class="table-card">
    <div class="table-header">
      <span class="table-name">${t.name}</span>
      <span class="table-badge badge-${t.badge}">${t.badgeLabel}</span>
    </div>
    <div class="field-list">${t.fields.map(renderField).join("")}</div>
  </div>`;
}

const tabsEl = document.getElementById("tabs");
const containerEl = document.getElementById("modules-container");

modules.forEach((m, i) => {
  const tab = document.createElement("button");
  tab.className = "tab" + (i === 0 ? " active" : "");
  tab.textContent = m.label;
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".module").forEach(mod => mod.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("mod-" + m.id).classList.add("active");
  };
  tabsEl.appendChild(tab);

  const mod = document.createElement("div");
  mod.className = "module" + (i === 0 ? " active" : "");
  mod.id = "mod-" + m.id;
  mod.innerHTML = `<div class="module-desc">${m.desc}</div><div class="tables-grid">${m.tables.map(renderTable).join("")}</div>`;
  containerEl.appendChild(mod);
});
</script>
</body>
</html>
