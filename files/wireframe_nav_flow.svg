<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,sans-serif">
  <rect width="1000" height="500" fill="#0d1117"/>

  <text x="500" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Navigation Flow &amp; Role-Based Access</text>
  <text x="500" y="50" text-anchor="middle" font-size="11" fill="#8b949e">All roles pass through Login · Route access determined by role after authentication</text>

  <!-- ── LOGIN (center top) ── -->
  <rect x="390" y="68" width="220" height="56" rx="10" fill="#161b22" stroke="#f7941d" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#f7941d">/login</text>
  <text x="500" y="110" text-anchor="middle" font-size="11" fill="#8b949e">Email + Password · JWT issued</text>

  <!-- Arrow down -->
  <line x1="500" y1="124" x2="500" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#nav-arr)"/>
  <text x="510" y="148" font-size="10" fill="#8b949e">auth check</text>

  <!-- Role fork diamond -->
  <polygon points="500,160 540,180 500,200 460,180" fill="#1c2128" stroke="#f7941d" stroke-width="1.5"/>
  <text x="500" y="184" text-anchor="middle" font-size="11" fill="#f0f6fc">role?</text>

  <!-- ── BRANCH LEFT: Supervisor (Telegram) ── -->
  <line x1="460" y1="180" x2="160" y2="180" stroke="#3fb950" stroke-width="1.5" marker-end="url(#nav-arr-g)"/>
  <text x="310" y="172" text-anchor="middle" font-size="10" fill="#3fb950">supervisor</text>

  <rect x="50" y="155" width="200" height="56" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="150" y="179" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950">Telegram Bot</text>
  <text x="150" y="196" text-anchor="middle" font-size="11" fill="#8b949e">Field operations only</text>

  <!-- Telegram sub-routes -->
  <line x1="150" y1="211" x2="150" y2="240" stroke="#3fb950" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="50" y="240" width="200" height="130" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="70" y="262" font-size="11" fill="#3fb950">• Add worker / site</text>
  <text x="70" y="280" font-size="11" fill="#3fb950">• Record attendance</text>
  <text x="70" y="298" font-size="11" fill="#3fb950">• Material receipt/consumption</text>
  <text x="70" y="316" font-size="11" fill="#3fb950">• Add expense</text>
  <text x="70" y="334" font-size="11" fill="#3fb950">• Update site progress</text>
  <text x="70" y="356" font-size="10" fill="#6e7681">via natural language (LLM agent)</text>

  <!-- ── BRANCH CENTER: Manager ── -->
  <line x1="500" y1="200" x2="500" y2="240" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#nav-arr-b)"/>
  <text x="510" y="226" font-size="10" fill="#58a6ff">manager</text>

  <rect x="390" y="240" width="220" height="56" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="500" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#58a6ff">/ Dashboard</text>
  <text x="500" y="282" text-anchor="middle" font-size="11" fill="#8b949e">KPI cards · Site overview · Alerts</text>

  <!-- Dashboard → sub-pages -->
  <line x1="440" y1="296" x2="350" y2="340" stroke="#58a6ff" stroke-width="1" marker-end="url(#nav-arr-b)"/>
  <rect x="260" y="340" width="180" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="350" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#58a6ff">/assistant</text>
  <text x="350" y="378" text-anchor="middle" font-size="10" fill="#8b949e">AI chat interface</text>

  <line x1="560" y1="296" x2="650" y2="340" stroke="#58a6ff" stroke-width="1" marker-end="url(#nav-arr-b)"/>
  <rect x="560" y="340" width="180" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
  <text x="650" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#58a6ff">/sites/:id</text>
  <text x="650" y="378" text-anchor="middle" font-size="10" fill="#8b949e">Per-site detail view</text>

  <!-- ── BRANCH RIGHT: Admin ── -->
  <line x1="540" y1="180" x2="800" y2="180" stroke="#f85149" stroke-width="1.5" marker-end="url(#nav-arr-r)"/>
  <text x="680" y="172" text-anchor="middle" font-size="10" fill="#f85149">admin</text>

  <rect x="800" y="155" width="180" height="56" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="890" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#f85149">/payroll</text>
  <text x="890" y="196" text-anchor="middle" font-size="11" fill="#8b949e">Payroll Workbook</text>

  <!-- Admin sub-routes -->
  <line x1="890" y1="211" x2="890" y2="240" stroke="#f85149" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="790" y="240" width="200" height="145" rx="8" fill="#0d1117" stroke="#f85149" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="810" y="262" font-size="11" fill="#f85149">• Generate payroll runs</text>
  <text x="810" y="280" font-size="11" fill="#f85149">• Finalize periods</text>
  <text x="810" y="298" font-size="11" fill="#f85149">• View financial reports</text>
  <text x="810" y="316" font-size="11" fill="#f85149">• Configure wage rates</text>
  <text x="810" y="334" font-size="11" fill="#f85149">• Manage budgets</text>
  <text x="810" y="356" font-size="10" fill="#6e7681">also has dashboard + assistant access</text>

  <!-- ALSO: Admin inherits manager access -->
  <line x1="800" y1="183" x2="610" y2="258" stroke="#f85149" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="712" y="225" font-size="9" fill="#6e7681">inherits</text>

  <!-- ── ARROWHEAD MARKERS ── -->
  <defs>
    <marker id="nav-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="nav-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="nav-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="nav-arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#f85149" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="30" y="440" width="940" height="46" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="60" y="456" width="12" height="12" rx="2" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="76" y="466" font-size="11" fill="#3fb950">Supervisor → Telegram only</text>
  <rect x="260" y="456" width="12" height="12" rx="2" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="276" y="466" font-size="11" fill="#58a6ff">Manager → Web dashboard + assistant</text>
  <rect x="530" y="456" width="12" height="12" rx="2" fill="none" stroke="#f85149" stroke-width="2"/>
  <text x="546" y="466" font-size="11" fill="#f85149">Admin → All routes including payroll</text>
  <text x="800" y="466" font-size="11" fill="#6e7681">JWT auth on all routes</text>
</svg>
